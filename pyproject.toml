[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-analytics"
version = "0.4.0"
description = "Scientific analytics baseline for PRISMA pairwise comparisons"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]
service = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pillow>=12,<13",
    "reportlab>=4.4,<5",
    "uvicorn[standard]>=0.34,<1",
]
desktop-build = [
    "pyinstaller>=6.15,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["prisma*"]
