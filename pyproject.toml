[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-desktop"
version = "2.0.4"
description = "PRISMA Desktop with an isolated scientific analytics kernel"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pillow>=12,<13",
    "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
desktop-build = [
    "pyinstaller>=6.15,<7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["prisma*", "src*"]

[tool.setuptools.package-data]
"src.db.migrations" = ["*.sql"]
